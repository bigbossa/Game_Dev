<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมุดภาพยุทธภพ · แผนที่และมอนสเตอร์</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #354c48; background: #f6f4eb; font-family: Tahoma, sans-serif; }
    main { max-width: 1240px; padding: 38px 26px; margin: auto; }
    header { display: flex; align-items: center; gap: 24px; justify-content: space-between; margin-bottom: 24px; }
    .eyebrow { font-size: 11px; letter-spacing: .22em; color: #849888; font-weight: bold; }
    h1 { font-size: clamp(23px, 4vw, 34px); margin: 10px 0; font-weight: 600; }
    p { color: #7b8c80; font-size: 13px; line-height: 1.8; margin: 0; }
    a { color: #3c7263; text-decoration: none; white-space: nowrap; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    select, button { font: inherit; font-size: 13px; border: 1px solid #d3ddd1; background: #fffdf6; border-radius: 12px; padding: 11px 16px; color: #456455; }
    button { cursor: pointer; } button[aria-pressed="true"] { background: #e0ecdc; }
    .scene { border: 8px solid #fffdf6; border-radius: 24px; overflow: hidden; box-shadow: 0 12px 35px #4d69551a; }
    #scene { width: 100%; display: block; aspect-ratio: 1140/530; }
    .caption { display: flex; justify-content: space-between; gap: 16px; padding: 15px 20px; background: #fffdf6; font-size: 12px; color: #83907f; }
    h2 { font-size: 19px; margin: 32px 0 16px; }
    #creatures { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; }
    article { background: #fffdf7; padding: 15px; border: 1px solid #e4e8dc; border-radius: 20px; text-align: center; }
    article canvas { width: 100%; aspect-ratio: 1.3; display: block; }
    article strong { font-size: 12px; display: block; min-height: 30px; }
    article small { color: #9caa93; font-size: 11px; }
    @media(max-width:600px) { main { padding: 22px 14px; } header { align-items: flex-start; } header a { font-size: 12px; } .caption { font-size: 10px; } #creatures { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<main>
  <header><div><span class="eyebrow">A LITTLE WORLD OF WONDERS</span><h1>ยุทธภพตัวจิ๋ว</h1><p>สีละมุน แสงอุ่น และเหล่าสหายตัวป้อมในโลกแฟนตาซี</p></div><a href="/">เข้าเกม ↗</a></header>
  <div class="toolbar"><label for="map">ดินแดน</label><select id="map"></select><button id="motion" type="button" aria-pressed="true">หยุดการเคลื่อนไหว</button></div>
  <section class="scene"><canvas id="scene" width="1140" height="530" aria-label="ตัวอย่างแผนที่และมอนสเตอร์"></canvas><div class="caption"><span id="place"></span><span>แสงและเงาแบบโมเดลจิ๋ว · ภาพที่ใช้ในเกมจริง</span></div></section>
  <h2>พบกับเหล่ามอนสเตอร์</h2><section id="creatures"></section>
</main>
<script src="/shared/common.js"></script>
<script src="/shared/village-map.js"></script>
<script src="/shared/hunting-layouts.js"></script>
<script src="/shared/world-data.js"></script>
<script src="js/world-art.js"></script>
<script src="js/hunting-art.js"></script>
<script src="js/monsters.js"></script>
<script src="js/monster-shapes.js"></script>
<script src="js/art-preview.js"></script>
</body>
</html>
